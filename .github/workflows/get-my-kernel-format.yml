
name: Process boot.img from URL

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: "URL to download the boot.img file"
        required: true
        type: string
        default: "https://filebin.net/6aqcc71gmqtqyqpn/boot.img"

jobs:
  process-boot-img:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Download boot.img from the provided URL
      - name: Download boot.img
        run: |
          curl -L -o boot.img "${{ github.event.inputs.boot_img_url }}"
          if [ ! -f "boot.img" ]; then
            echo "Failed to download boot.img. Exiting."
            exit 1
          fi

      # Step 3: Unpack, replace kernel and repack boot.img
      - name: Process boot.img
        run: |
          chmod +x magiskboot

          mkdir work
          cp boot.img work/
          cp kernel work/replacement-kernel

          cd work

          ../magiskboot unpack -h boot.img

          cp replacement-kernel kernel

          ../magiskboot repack boot.img new-boot.img

      # Step 4: Upload rebuilt boot image
      - name: Upload new boot image
        uses: actions/upload-artifact@v4
        with:
          name: new-boot-img
          path: work/new-boot.img
